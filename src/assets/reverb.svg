<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Sombra principal de elevação do ícone -->
    <filter id="icon-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Sombra de relevo do texto -->
    <filter id="text-press-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3d1400" flood-opacity="0.75" />
    </filter>

    <!-- Gradiente do corpo do vinil -->
    <radialGradient id="body-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#090a0c" />
      <stop offset="68%" stop-color="#111317" />
      <stop offset="94%" stop-color="#08090a" />
      <stop offset="100%" stop-color="#1f2227" />
    </radialGradient>

    <!-- Chanfro da borda externa -->
    <linearGradient id="edge-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7" />
    </linearGradient>

    <!-- Gradiente do rótulo central -->
    <radialGradient id="label-base" cx="42%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#f57c2a" />
      <stop offset="55%" stop-color="#d95811" />
      <stop offset="85%" stop-color="#a63d05" />
      <stop offset="100%" stop-color="#6e2401" />
    </radialGradient>

    <!-- Gradiente da tipografia Reverb -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe6d6" />
    </linearGradient>

    <!-- Reflexos especulares em cone (Anisotrópicos) -->
    <linearGradient id="sheen-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.24" />
    </linearGradient>

    <linearGradient id="sheen-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5c9eb" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#a5c9eb" stop-opacity="0.14" />
    </linearGradient>

    <!-- Chanfro do orifício central -->
    <linearGradient id="spindle-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </linearGradient>

    <!-- Máscara dos sulcos de áudio -->
    <mask id="grooves-mask">
      <rect width="800" height="800" fill="#000" />
      <circle cx="400" cy="400" r="382" fill="#fff" />
      <circle cx="400" cy="400" r="162" fill="#000" />
    </mask>

    <!-- Textura de microsulcos -->
    <pattern id="micro-texture" width="800" height="800" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08">
        <circle cx="400" cy="400" r="170" /><circle cx="400" cy="400" r="174" />
        <circle cx="400" cy="400" r="178" /><circle cx="400" cy="400" r="183" />
        <circle cx="400" cy="400" r="188" /><circle cx="400" cy="400" r="193" />
        <circle cx="400" cy="400" r="199" /><circle cx="400" cy="400" r="205" />
        <circle cx="400" cy="400" r="211" /><circle cx="400" cy="400" r="218" />
        <circle cx="400" cy="400" r="225" /><circle cx="400" cy="400" r="232" />
        <circle cx="400" cy="400" r="240" /><circle cx="400" cy="400" r="248" />
        <circle cx="400" cy="400" r="256" /><circle cx="400" cy="400" r="265" />
        <circle cx="400" cy="400" r="274" /><circle cx="400" cy="400" r="283" />
        <circle cx="400" cy="400" r="293" /><circle cx="400" cy="400" r="303" />
        <circle cx="400" cy="400" r="313" /><circle cx="400" cy="400" r="324" />
        <circle cx="400" cy="400" r="335" /><circle cx="400" cy="400" r="346" />
        <circle cx="400" cy="400" r="357" /><circle cx="400" cy="400" r="367" />
        <circle cx="400" cy="400" r="375" />
      </g>
    </pattern>
  </defs>

  <!-- 1. CORPO DO DISCO -->
  <g filter="url(#icon-drop-shadow)">
    <circle cx="400" cy="400" r="388" fill="url(#body-gradient)" />
    <circle cx="400" cy="400" r="386.5" fill="none" stroke="url(#edge-bevel)" stroke-width="2.5" />
  </g>

  <!-- 2. SULCOS DE ÁUDIO -->
  <g fill="none">
    <circle cx="400" cy="400" r="381" stroke="#000000" stroke-width="4" opacity="0.8" />
    <circle cx="400" cy="400" r="378" stroke="#1c1f24" stroke-width="1" opacity="0.6" />

    <rect width="800" height="800" fill="url(#micro-texture)" mask="url(#grooves-mask)" />

    <!-- Faixas musicais -->
    <circle cx="400" cy="400" r="350" stroke="#000000" stroke-width="32" opacity="0.35" />
    <circle cx="400" cy="400" r="332" stroke="#2a2e35" stroke-width="0.8" opacity="0.4" />
    <circle cx="400" cy="400" r="322" stroke="#050607" stroke-width="2.5" opacity="0.9" />

    <circle cx="400" cy="400" r="298" stroke="#000000" stroke-width="40" opacity="0.32" />
    <circle cx="400" cy="400" r="280" stroke="#25292e" stroke-width="0.75" opacity="0.35" />
    <circle cx="400" cy="400" r="268" stroke="#050607" stroke-width="3" opacity="0.9" />

    <circle cx="400" cy="400" r="245" stroke="#000000" stroke-width="38" opacity="0.35" />
    <circle cx="400" cy="400" r="230" stroke="#22252a" stroke-width="0.8" opacity="0.4" />
    <circle cx="400" cy="400" r="215" stroke="#050607" stroke-width="2.5" opacity="0.9" />

    <circle cx="400" cy="400" r="195" stroke="#000000" stroke-width="32" opacity="0.35" />
  </g>

  <!-- 3. ÁREA LISA CENTRAL (DEAD WAX) -->
  <g fill="none">
    <circle cx="400" cy="400" r="162" stroke="#080809" stroke-width="16" opacity="0.9" />
    <path d="M 400,240 A 160,160 0 0,1 556,365 A 150,150 0 0,1 420,550 A 140,140 0 0,1 262,420 A 132,132 0 0,1 390,268"
          stroke="#000000" stroke-width="1.2" opacity="0.75" />
    <path d="M 390,268 A 132,132 0 0,1 530,390 A 125,125 0 0,1 400,525"
          stroke="#1e2024" stroke-width="0.7" opacity="0.5" />
  </g>

  <!-- 4. REFLEXOS ESPECULARES -->
  <g mask="url(#grooves-mask)" style="mix-blend-mode: screen;">
    <path d="M 400,400 L 220,20 A 390,390 0 0,1 490,28 Z" fill="url(#sheen-grad-1)" />
    <path d="M 400,400 L 580,780 A 390,390 0 0,1 310,772 Z" fill="url(#sheen-grad-1)" />
    <path d="M 400,400 L 680,180 A 390,390 0 0,1 780,360 Z" fill="url(#sheen-grad-2)" />
    <path d="M 400,400 L 120,620 A 390,390 0 0,1 20,440 Z" fill="url(#sheen-grad-2)" />
  </g>

  <!-- 5. RÓTULO CENTRAL -->
  <g id="app-center-label">
    <circle cx="400" cy="400" r="130" fill="#000000" opacity="0.5" />
    <circle cx="400" cy="400" r="128" fill="url(#label-base)" />

    <!-- Anéis concêntricos de prensagem -->
    <circle cx="400" cy="400" r="95" fill="none" stroke="#481802" stroke-width="1.8" opacity="0.3" />
    <circle cx="400" cy="400" r="94" fill="none" stroke="#ffaa70" stroke-width="0.8" opacity="0.2" />
    <circle cx="400" cy="400" r="50" fill="none" stroke="#481802" stroke-width="1.8" opacity="0.3" />
    <circle cx="400" cy="400" r="49" fill="none" stroke="#ffaa70" stroke-width="0.8" opacity="0.2" />
    <circle cx="400" cy="400" r="122" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />

    <!-- TIPOGRAFIA "Reverb" (Expandida até o diâmetro do selo e rente ao furo central) -->
    <g id="brand-typography" filter="url(#text-press-shadow)">
      <text x="405" y="380"
            font-family="'Plus Jakarta Sans', 'Inter', 'Outfit', 'Montserrat', -apple-system, sans-serif"
            font-size="68"
            font-weight="900"
            letter-spacing="-1.5"
            fill="url(#text-gradient)"
            text-anchor="middle">Reverb</text>
    </g>

    <!-- ONDAS ACÚSTICAS (17 barras: 9 originais + 8 novas barras com decaimento suave) -->
    <g id="reverb-waves" fill="#ffffff" opacity="0.8">
      <!-- Lado Esquerdo -->
      <rect x="334.4" y="447" width="3.2" height="6" rx="1.6" opacity="0.45" />
      <rect x="342.4" y="445.5" width="3.2" height="9" rx="1.6" opacity="0.55" />
      <rect x="350.4" y="443.5" width="3.2" height="13" rx="1.6" opacity="0.65" />
      <rect x="358.4" y="441" width="3.2" height="18" rx="1.6" opacity="0.75" />
      <rect x="366.4" y="438" width="3.2" height="24" rx="1.6" />
      <rect x="374.4" y="434.5" width="3.2" height="31" rx="1.6" />
      <rect x="382.4" y="431.5" width="3.2" height="37" rx="1.6" />
      <rect x="390.4" y="429" width="3.2" height="42" rx="1.6" />

      <!-- Barra Central (Pico) -->
      <rect x="398.4" y="427" width="3.2" height="46" rx="1.6" fill="#fff5ec" opacity="0.95" />

      <!-- Lado Direito -->
      <rect x="406.4" y="429" width="3.2" height="42" rx="1.6" />
      <rect x="414.4" y="431.5" width="3.2" height="37" rx="1.6" />
      <rect x="422.4" y="434.5" width="3.2" height="31" rx="1.6" />
      <rect x="430.4" y="438" width="3.2" height="24" rx="1.6" />
      <rect x="438.4" y="441" width="3.2" height="18" rx="1.6" opacity="0.75" />
      <rect x="446.4" y="443.5" width="3.2" height="13" rx="1.6" opacity="0.65" />
      <rect x="454.4" y="445.5" width="3.2" height="9" rx="1.6" opacity="0.55" />
      <rect x="462.4" y="447" width="3.2" height="6" rx="1.6" opacity="0.45" />
    </g>
  </g>

  <!-- 6. ORIFÍCIO CENTRAL (SPINDLE HOLE) -->
  <g id="spindle-hole">
    <circle cx="400" cy="400" r="20" fill="#000000" opacity="0.25" />
    <circle cx="400" cy="400" r="16.5" fill="none" stroke="url(#spindle-bevel)" stroke-width="2" />
    <circle cx="400" cy="400" r="15" fill="#020203" />
  </g>
</svg>
