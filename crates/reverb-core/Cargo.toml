[package]
name = "reverb-core"
description = "Núcleo do Reverb (Rust puro, sem dependência de Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
futures-util = "0.3.34"
hex = "0.4.3"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
regex.workspace = true
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite.workspace = true
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
zip = "8.6.0"

[dev-dependencies]
sysinfo = "0.39.6"
tempfile.workspace = true
wiremock = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
